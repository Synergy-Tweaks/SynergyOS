  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedapplications', value: 'visiosolution', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedapplications', value: 'wdsolution', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedapplications', value: 'xlsolution', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedsolutiontypes', value: 'agave', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedsolutiontypes', value: 'appaddins', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedsolutiontypes', value: 'comaddins', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedsolutiontypes', value: 'documentfiles', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM\preventedsolutiontypes', value: 'templatefiles', type: REG_DWORD, data: '1'}

